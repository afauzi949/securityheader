services:
  flask_app:
    container_name: securityheaderAPI
    image: securityheader:1.0
    build: .
    networks:
      - compose_kong-net
    ports:
      - "5000:5000"
    environment:
      - DB_URL=mysql+pymysql://root:root@flask_db:3306/securityheader  
      - FLASK_APP=main.py
    depends_on:
      flask_db:
        condition: service_healthy
    restart: always
    command: sh -c "sleep 15 && python main.py"

  flask_db:
    container_name: securityheaderDB
    image: mysql:8.0
    ports:
      - "3306:3306"  
    networks:
      - compose_kong-net
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=securityheader
      - MYSQL_USER=flask_user
      - MYSQL_PASSWORD=flask_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  compose_kong-net: 
    external: true

volumes:
  mysql_data:
